<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Giriş</title>

<style>
body {
    margin: 0;
    padding: 0;
    font-family: Arial;
    background: linear-gradient(135deg, #141e30, #243b55);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.box {
    background: #1e1e2f;
    padding: 40px;
    border-radius: 12px;
    width: 300px;
    text-align: center;
    box-shadow: 0 0 25px rgba(0,0,0,0.6);
}

h2 {
    color: white;
    margin-bottom: 20px;
}

input {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border: none;
    border-radius: 6px;
    outline: none;
}

button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    background: #00c6ff;
    border: none;
    color: white;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #0072ff;
}

.error {
    color: red;
    margin-top: 10px;
}
</style>

</head>

<body>

<div class="box">
    <h2>📚 Kitap Sistem</h2>

    <form method="post">
        <input name="kullanici" placeholder="Kullanıcı">
        <input name="sifre" type="password" placeholder="Şifre">
        <button>Giriş Yap</button>
    </form>

    <div class="error">{{ hata }}</div>
</div>

</body>
</html>
