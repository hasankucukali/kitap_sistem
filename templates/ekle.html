<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Ürün Ekle</title>
    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            padding: 30px;
        }
        .box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 400px;
            margin: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            margin-top: 15px;
            width: 100%;
            padding: 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
        }
        .msg {
            margin-top: 10px;
            color: green;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark px-3">
    <a href="/" class="btn btn-light">🏠 Ana Menü</a>
    <a href="/stok" class="btn btn-secondary">📦 Stok</a>
    <a href="/ekle" class="btn btn-primary">➕ Ekle</a>
    <a href="/satis" class="btn btn-success">💰 Satış</a>
</nav>

<div class="box">
    <h2>📚 Ürün Ekle</h2>

    <form method="POST" id="form">
        <input type="text" name="barkod" id="barkod" placeholder="Barkod okut" autofocus>
        <input type="text" name="ad" placeholder="Kitap adı">
        <input type="text" name="yazar" placeholder="Yazar">
        <input type="number" step="0.01" name="fiyat" placeholder="Fiyat">
        <input type="number" name="stok" placeholder="Stok">

        <button type="submit">Kaydet</button>
    </form>

    {% if mesaj %}
        <div class="msg">{{ mesaj }}</div>
    {% endif %}
</div>
    

<script>
// 🔥 ENTER TUŞUNU ENGELLE (BARKOD OKUTUNCA FORM GİTMESİN)
document.getElementById("barkod").addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        e.preventDefault();
    }
});
</script>
<a href="/stok" style="display:block;margin-top:10px;text-align:center;">
    ← Stok sayfasına dön
</a>
</body>
</html>
<hr>

<h4>📥 Excel ile Toplu Ürün Ekle</h4>

<form action="/excel_yukle" method="post" enctype="multipart/form-data">
    <input type="file" name="file" class="form-control" required>
    <button class="btn btn-dark mt-2">Excel Yükle</button>
</form>
