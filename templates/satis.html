<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Satış</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- 🔝 MENÜ -->
<nav class="navbar navbar-dark bg-dark px-3">
    <a href="/" class="btn btn-light">🏠 Ana Menü</a>
    <a href="/stok" class="btn btn-secondary">📦 Stok</a>
    <a href="/ekle" class="btn btn-primary">➕ Ekle</a>
</nav>

<div class="container mt-4">

<h3>💰 Satış Ekranı</h3>

<form method="post">
    <input name="barkod" class="form-control" placeholder="Barkod okut" autofocus>
    <button class="btn btn-success mt-2">Ekle</button>
</form>

<p class="text-danger">{{mesaj}}</p>

<hr>

<table class="table table-bordered">
<tr>
<th>Ad</th>
<th>Adet</th>
<th>Fiyat</th>
<th>İşlem</th>
</tr>

{% for s in sepet %}
<tr>
<td>{{s.ad}}</td>

<td>
    <a href="/azalt/{{s.barkod}}" class="btn btn-warning btn-sm">-</a>
    {{s.adet}}
    <a href="/arttir/{{s.barkod}}" class="btn btn-success btn-sm">+</a>
</td>

<td>{{s.fiyat}}</td>

<td>
    <a href="/sil/{{s.barkod}}" class="btn btn-danger btn-sm">Sil</a>
</td>
</tr>
{% endfor %}

</table>

<h4>Toplam: {{toplam}} TL</h4>

<a href="/tamamla" class="btn btn-primary">Satışı Tamamla</a>

</div>

</body>
</html>
