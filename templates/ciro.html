<!DOCTYPE html>
<html>
<head>
<title>Ciro</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

<h2>💰 Toplam Ciro: {{toplam}} ₺</h2>

<hr>

<table class="table table-bordered">
<tr>
<th>Tutar</th>
<th>Ödeme</th>
<th>Tarih</th>
</tr>

{% for s in satislar %}
<tr>
<td>{{ s[0] }} ₺</td>
<td>{{ s[1] }}</td>
<td>{{ s[2] }}</td>
</tr>
{% endfor %}

</table>

</div>

</body>
</html>
