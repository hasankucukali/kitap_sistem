<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Satış</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: #111;
    color: white;
}

.input-pos {
    font-size: 28px;
    padding: 20px;
    text-align: center;
}

.table td, .table th {
    font-size: 18px;
}

.toplam-box {
    font-size: 40px;
    font-weight: bold;
    text-align: right;
    margin-top: 20px;
}

.flash {
    animation: flash 0.3s;
}

@keyframes flash {
    0% {background: #198754;}
    100% {background: transparent;}
}

.secili {
    border: 3px solid yellow !important;
}
</style>
</head>

<body>

<div class="container mt-4">

<h2>🧾 SATIŞ EKRANI</h2>

<!-- 🔥 Barkod okuma -->
<form method="post" id="form">
    <input name="barkod"
           id="barkod"
           class="form-control input-pos"
           placeholder="Barkod okut..."
           autofocus>
</form>

{% if mesaj %}
<div class="alert alert-danger mt-2">{{ mesaj }}</div>
{% endif %}

<!-- 📦 Sepet -->
<table class="table table-dark table-striped mt-3">
<tr>
<th>Ad</th>
<th>Adet</th>
<th>Fiyat</th>
<th>Toplam</th>
</tr>

{% for i in sepet %}
<tr class="urun">
<td>{{ i.ad }}</td>
<td>{{ i.adet }}</td>
<td>{{ i.fiyat }}</td>
<td>{{ i.adet * i.fiyat }}</td>
</tr>
{% endfor %}
</table>

<!-- 💰 Toplam -->
<div class="toplam-box">
Toplam: {{ toplam }} ₺
</div>

<!-- 💳 Ödeme -->
<div class="mt-4">
    <h4>💳 Ödeme Tipi</h4>

    <div class="d-flex gap-3">
        <button type="button" id="nakitBtn" class="btn btn-warning w-50 secili" onclick="sec('nakit')">
            💵 Nakit
        </button>

        <button type="button" id="kartBtn" class="btn btn-primary w-50" onclick="sec('kart')">
            💳 Kart
        </button>
    </div>
</div>

<!-- ✅ Satış tamamla -->
<form action="/tamamla" method="post">
    <input type="hidden" name="odeme" id="odeme" value="nakit">

    <button class="btn btn-success w-100 mt-4" style="font-size:25px;">
        💰 SATIŞI TAMAMLA
    </button>
</form>

</div>

<!-- 🔊 Ses -->
<audio id="beep" src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"></audio>

<script>
// 🔥 Barkod ENTER ile gönder
document.getElementById("barkod").addEventListener("keypress", function(e){
    if(e.key === "Enter"){
        e.preventDefault();
        document.getElementById("form").submit();
    }
});

// 🔥 Input sürekli aktif
setInterval(()=>{
    document.getElementById("barkod").focus();
},500);

// 🔥 Son ürün flash + beep
window.onload = () => {
    let rows = document.querySelectorAll(".urun");
    if(rows.length > 0){
        rows[rows.length-1].classList.add("flash");
        document.getElementById("beep").play();
    }
}

// 💳 Ödeme seçimi
function sec(tip){
    document.getElementById("odeme").value = tip;

    document.getElementById("nakitBtn").classList.remove("secili");
    document.getElementById("kartBtn").classList.remove("secili");

    if(tip === "nakit"){
        document.getElementById("nakitBtn").classList.add("secili");
    } else {
        document.getElementById("kartBtn").classList.add("secili");
    }
}
</script>

</body>
</html>
