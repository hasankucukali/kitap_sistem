<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Ürün Ekle</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-3">
    <a href="/" class="btn btn-light">🏠 Ana Menü</a>
    <a href="/stok" class="btn btn-secondary">📦 Stok</a>
    <a href="/satis" class="btn btn-success">💰 Satış</a>
</nav>

<div class="container mt-4">

<h3>➕ Ürün Ekle</h3>

<form method="post">
    <input name="barkod" class="form-control mb-2" placeholder="Barkod">
    <input name="ad" class="form-control mb-2" placeholder="Kitap adı">
    <input name="yazar" class="form-control mb-2" placeholder="Yazar">
    <input name="fiyat" class="form-control mb-2" placeholder="Fiyat">
    <input name="stok" class="form-control mb-2" placeholder="Stok">

    <button class="btn btn-primary">Kaydet</button>
</form>

<p class="text-danger mt-2">{{mesaj}}</p>

<hr>

<h4>📥 Excel ile Toplu Yükleme</h4>

<form action="/excel_yukle" method="post" enctype="multipart/form-data">
    <input type="file" name="file" class="form-control">
    <button class="btn btn-dark mt-2">Excel Yükle</button>
</form>

</div>

</body>
</html>
