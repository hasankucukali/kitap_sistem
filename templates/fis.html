<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Fiş</title>

<style>
body {
    font-family: monospace;
    width: 300px;
    margin: auto;
    padding: 10px;
}

.center {
    text-align: center;
}

hr {
    border: 1px dashed black;
}

button {
    margin-top: 10px;
    width: 100%;
    padding: 10px;
    font-size: 14px;
}

/* 🔥 YAZDIRIRKEN BUTONLARI GİZLE */
@media print {
    button {
        display: none;
    }
}
</style>

<script>
function yazdirVeDon() {
    window.print();

    // Yazdırma sonrası otomatik geri dön
    setTimeout(() => {
        window.location.href = "/satis";
    }, 1000);
}

// Sayfa açılır açılmaz yazdır
window.onload = function() {
    yazdirVeDon();
};
</script>

</head>

<body>

<div class="center">
    <h3>📚 GENÇ KİTABEVİ </h3>
    <p>{{tarih}}</p>
</div>

<hr>

{% for i in sepet %}
<p>
{{i.ad}}<br>
{{i.adet}} x {{i.fiyat}} = {{i.adet * i.fiyat}} ₺
</p>
{% endfor %}

<hr>

<h3>Toplam: {{toplam}} ₺</h3>

<hr>

<div class="center">
    <p>Teşekkür ederiz</p>
</div>

<button onclick="yazdirVeDon()">🧾 Yazdır</button>

</body>
</html>
