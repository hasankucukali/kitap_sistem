<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Stok</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light">

<!-- MENÜ -->
<nav class="navbar navbar-dark bg-dark px-3">
    <a href="/" class="btn btn-light">🏠 Ana Menü</a>
    <a href="/ekle" class="btn btn-primary">➕ Ekle</a>
    <a href="/satis" class="btn btn-success">💰 Satış</a>
</nav>

<div class="container mt-4">

<h3>📦 Stok Listesi</h3>
<form method="get" class="mb-3">
    <input type="text" name="q" class="form-control" placeholder="Kitap ara...">
    <button type="submit" class="btn btn-primary mt-2">Ara</button>
</form>
<table class="table table-bordered table-striped mt-3">
<thead class="table-dark">
<tr>
<th>Barkod</th>
<th>Ad</th>
<th>Yazar</th>
<th>Fiyat</th>
<th>Stok</th>
<th>İşlem</th>

</tr>
</thead>

<tbody>
{% for k in kitaplar %}
<tr>
<td>{{k[0]}}</td>
<td>{{k[1]}}</td>
<td>{{k[2]}}</td>
<td>{{k[3]}}</td>
<td>{{k[4]}}</td>
<td>
<a href="/stok_arttir/{{kitap[0]}}" class="btn btn-success btn-sm">+</a>
<a href="/stok_azalt/{{kitap[0]}}" class="btn btn-warning btn-sm">-</a>
<a href="/stok_sil/{{kitap[0]}}" class="btn btn-danger btn-sm">X</a>
</td>
</tr>
{% endfor %}
</tbody>

</form>
</table>

</div>

</body>
</html>
