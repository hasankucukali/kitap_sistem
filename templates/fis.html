<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Fiş</title>

<style>
body {
    font-family: monospace;
    width: 300px;
    margin: auto;
    padding: 10px;
}

.center {
    text-align: center;
}

hr {
    border: 1px dashed black;
}

button {
    margin-top: 10px;
    width: 100%;
    padding: 10px;
    font-size: 14px;
    cursor: pointer;
}

/* 🔥 Yazdırırken butonları gizle */
@media print {
    button {
        display: none;
    }
}
</style>

<script>
function yazdir() {
    window.print();
}
</script>

</head>

<body>

<div class="center">
    <h3>📚 GENÇ KİTABEVİ </h3>
    <p>{{tarih}}</p>
</div>

<hr>

{% for i in sepet %}
<p>
{{i.ad}}<br>
{{i.adet}} x {{i.fiyat}} = {{i.adet * i.fiyat}} ₺
</p>
{% endfor %}

<hr>

<h3>Toplam: {{toplam}} ₺</h3>

<hr>

<div class="center">
    <h3 style="color:green;">{{mesaj}}</h3>
    <p>Teşekkür ederiz</p>
</div>

<button onclick="yazdir()">🧾 Fiş Yazdır</button>
<a href="/satis"><button>⬅️ Yeni Satış</button></a>

</body>
</html>
