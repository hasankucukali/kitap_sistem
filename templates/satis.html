<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Satış</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body { background:#111; color:white; }

.input-pos {
    font-size:28px;
    padding:20px;
    text-align:center;
}

.table td, .table th { font-size:18px; }

.toplam-box {
    font-size:40px;
    font-weight:bold;
    text-align:right;
    margin-top:20px;
}

.flash { animation: flash 0.3s; }
@keyframes flash {
    0% {background:#198754;}
    100% {background:transparent;}
}

.secili {
    border:3px solid yellow !important;
}
</style>
</head>

<body>

<div class="container mt-4">

<div class="d-flex justify-content-between align-items-center">
    <h2>🧾 SATIŞ EKRANI</h2>
    <a href="/" class="btn btn-secondary">⬅️ Menü</a>
</div>

<!-- 🔥 TEK FORM -->
<form method="post" id="mainForm">

    <!-- Barkod -->
    <input name="barkod"
           id="barkod"
           class="form-control input-pos"
           placeholder="Barkod okut..."
           autofocus
           oninput="barkodGeldi(this)">

    <!-- Ödeme -->
    <div class="mt-4">
        <h4>💳 Ödeme Tipi</h4>

        <div class="d-flex gap-3">
            <button type="button" id="nakitBtn" class="btn btn-warning w-50 secili" onclick="sec('nakit')">
                💵 Nakit
            </button>

            <button type="button" id="kartBtn" class="btn btn-primary w-50" onclick="sec('kart')">
                💳 Kart
            </button>
        </div>
    </div>

    <input type="hidden" name="odeme" id="odeme" value="nakit">

</form>

{% if mesaj %}
<div class="alert alert-danger mt-2">{{ mesaj }}</div>
{% endif %}

<!-- 📦 Sepet -->
<table class="table table-dark table-striped mt-3">
<tr>
<th>Ad</th>
<th>Adet</th>
<th>Fiyat</th>
<th>Toplam</th>
<th>İşlem</th>
</tr>

{% for i in sepet %}
<tr class="urun">
<td>{{ i.ad }}</td>
<td>{{ i.adet }}</td>
<td>{{ i.fiyat }}</td>
<td>{{ i.adet * i.fiyat }}</td>

<td>
<a href="/sepet_arttir/{{i.barkod}}" class="btn btn-success btn-sm">+</a>
<a href="/sepet_azalt/{{i.barkod}}" class="btn btn-warning btn-sm">-</a>
<a href="/sepet_sil/{{i.barkod}}" class="btn btn-danger btn-sm">X</a>
</td>
</tr>
{% endfor %}
</table>

<!-- 💰 Toplam -->
<div class="toplam-box">
Toplam: {{ toplam }} ₺
</div>

<!-- ✅ Satış tamamla -->
<form action="/tamamla" method="post">
    <input type="hidden" name="odeme" id="odeme2" value="nakit">

    <button class="btn btn-success w-100 mt-4" style="font-size:25px;">
        💰 SATIŞI TAMAMLA
    </button>
</form>

</div>

<audio id="beep" src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"></audio>

<script>
// 🔥 Barkod otomatik gönder
function barkodGeldi(input){
    let val = input.value.trim();

    // barkod genelde uzun olur → otomatik gönder
    if(val.length >= 5){
        document.getElementById("mainForm").submit();
    }
}

// 🔥 sürekli focus
setInterval(()=>{
    document.getElementById("barkod").focus();
},500);

// 🔥 ödeme seçimi
function sec(tip){
    document.getElementById("odeme").value = tip;
    document.getElementById("odeme2").value = tip;

    document.getElementById("nakitBtn").classList.remove("secili");
    document.getElementById("kartBtn").classList.remove("secili");

    if(tip === "nakit"){
        document.getElementById("nakitBtn").classList.add("secili");
    } else {
        document.getElementById("kartBtn").classList.add("secili");
    }
}

// 🔥 flash + beep
window.onload = () => {
    let rows = document.querySelectorAll(".urun");
    if(rows.length > 0){
        rows[rows.length-1].classList.add("flash");
        document.getElementById("beep").play();
    }
}
</script>

</body>
</html>
